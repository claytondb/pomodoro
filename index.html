<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer - Focus & Productivity</title>
    <meta name="description" content="Simple Pomodoro timer for focus and productivity. 25-minute work sessions with 5-minute breaks.">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pomodoro">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Pomodoro Timer">
    <meta property="og:description" content="Simple focus timer using the Pomodoro Technique. 25-minute work sessions with 5-minute breaks.">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Pomodoro Timer">
    <meta name="twitter:description" content="Simple Pomodoro timer for focus and productivity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --work-color: #FF6B6B;
            --break-color: #4ECDC4;
            --long-break-color: #9B59B6;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        body.work {
            background: linear-gradient(135deg, #2d1f1f 0%, #1a1a2e 100%);
        }

        body.break {
            background: linear-gradient(135deg, #1f2d2d 0%, #1a1a2e 100%);
        }

        body.long-break {
            background: linear-gradient(135deg, #251f2d 0%, #1a1a2e 100%);
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Mode tabs */
        .mode-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .mode-tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .mode-tab:hover {
            background: rgba(255,255,255,0.15);
        }

        .mode-tab.active {
            background: var(--work-color);
        }

        .mode-tab.active.break {
            background: var(--break-color);
        }

        .mode-tab.active.long-break {
            background: var(--long-break-color);
        }

        /* Timer display */
        .timer-container {
            position: relative;
            margin: 40px auto;
        }

        .timer-ring {
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .timer-ring svg {
            transform: rotate(-90deg);
        }

        .timer-ring circle {
            fill: none;
            stroke-width: 8;
        }

        .timer-ring .bg {
            stroke: rgba(255,255,255,0.1);
        }

        .timer-ring .progress {
            stroke: var(--work-color);
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .session-label {
            font-size: 1rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.2);
        }

        .control-btn.primary {
            width: 90px;
            height: 90px;
            background: var(--work-color);
            font-size: 2.2rem;
        }

        .control-btn.primary:hover {
            background: #ff5252;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Settings */
        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .settings-btn:hover {
            transform: rotate(45deg);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(30, 30, 50, 0.98);
            backdrop-filter: blur(10px);
            padding: 60px 20px 20px;
            transition: right 0.3s;
            overflow-y: auto;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-panel h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .setting {
            margin-bottom: 20px;
        }

        .setting label {
            display: block;
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .setting input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .setting input[type="checkbox"] {
            margin-right: 10px;
        }

        .close-settings {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border: none;
            background: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
        }

        .close-settings:hover {
            opacity: 1;
        }

        /* Task input */
        .task-input {
            margin-bottom: 20px;
        }

        .task-input input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }

        .task-input input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .task-input input:focus {
            outline: none;
            border-color: var(--work-color);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--work-color);
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 500;
            transition: transform 0.3s;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        footer {
            position: fixed;
            bottom: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="work">
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>

    <div class="settings-panel" id="settings">
        <button class="close-settings" onclick="toggleSettings()">×</button>
        <h3>Settings</h3>
        
        <div class="setting">
            <label>Work Duration (minutes)</label>
            <input type="number" id="work-duration" value="25" min="1" max="60" onchange="updateSettings()">
        </div>
        
        <div class="setting">
            <label>Short Break (minutes)</label>
            <input type="number" id="break-duration" value="5" min="1" max="30" onchange="updateSettings()">
        </div>
        
        <div class="setting">
            <label>Long Break (minutes)</label>
            <input type="number" id="long-break-duration" value="15" min="1" max="60" onchange="updateSettings()">
        </div>
        
        <div class="setting">
            <label>Long Break After (pomodoros)</label>
            <input type="number" id="long-break-interval" value="4" min="2" max="10" onchange="updateSettings()">
        </div>
        
        <div class="setting">
            <label>
                <input type="checkbox" id="auto-start" checked>
                Auto-start next timer
            </label>
        </div>
        
        <div class="setting">
            <label>
                <input type="checkbox" id="sound-enabled" checked>
                Sound notifications
            </label>
        </div>
    </div>

    <div class="notification" id="notification">Time's up! 🍅</div>

    <div class="container">
        <h1>🍅 Pomodoro Timer</h1>

        <div class="task-input">
            <input type="text" id="task" placeholder="What are you working on?">
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="work" onclick="setMode('work')">Work</button>
            <button class="mode-tab" data-mode="break" onclick="setMode('break')">Break</button>
            <button class="mode-tab" data-mode="long-break" onclick="setMode('long-break')">Long Break</button>
        </div>

        <div class="timer-container">
            <div class="timer-ring">
                <svg width="280" height="280">
                    <circle class="bg" cx="140" cy="140" r="130"></circle>
                    <circle class="progress" id="progress" cx="140" cy="140" r="130"></circle>
                </svg>
            </div>
            <div class="timer-display">
                <div class="time" id="time">25:00</div>
                <div class="session-label" id="session-label">Focus Time</div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="resetTimer()">🔄</button>
            <button class="control-btn primary" id="start-btn" onclick="toggleTimer()">▶️</button>
            <button class="control-btn" onclick="skipTimer()">⏭️</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="pomodoros">0</div>
                <div class="stat-label">Pomodoros</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="focus-time">0h 0m</div>
                <div class="stat-label">Focus Time</div>
            </div>
        </div>
    </div>

    <footer>Press Space to start/pause</footer>

    <script>
        // Settings
        let settings = {
            workDuration: 25,
            breakDuration: 5,
            longBreakDuration: 15,
            longBreakInterval: 4,
            autoStart: true,
            soundEnabled: true
        };

        // State
        let currentMode = 'work';
        let timeRemaining = settings.workDuration * 60;
        let totalTime = settings.workDuration * 60;
        let isRunning = false;
        let intervalId = null;
        let pomodorosCompleted = 0;
        let totalFocusSeconds = 0;

        // DOM elements
        const timeDisplay = document.getElementById('time');
        const sessionLabel = document.getElementById('session-label');
        const startBtn = document.getElementById('start-btn');
        const progressCircle = document.getElementById('progress');
        const pomodorosDisplay = document.getElementById('pomodoros');
        const focusTimeDisplay = document.getElementById('focus-time');
        const notification = document.getElementById('notification');

        // Circle circumference
        const circumference = 2 * Math.PI * 130;
        progressCircle.style.strokeDasharray = circumference;
        progressCircle.style.strokeDashoffset = 0;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(timeRemaining);
            
            // Update progress ring
            const progress = (totalTime - timeRemaining) / totalTime;
            const offset = circumference * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;

            // Update document title
            document.title = `${formatTime(timeRemaining)} - Pomodoro`;
        }

        function updateStats() {
            pomodorosDisplay.textContent = pomodorosCompleted;
            const hours = Math.floor(totalFocusSeconds / 3600);
            const mins = Math.floor((totalFocusSeconds % 3600) / 60);
            focusTimeDisplay.textContent = `${hours}h ${mins}m`;
        }

        function setMode(mode) {
            currentMode = mode;
            
            // Update tabs
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('active', 'break', 'long-break');
            });
            const activeTab = document.querySelector(`[data-mode="${mode}"]`);
            activeTab.classList.add('active');
            if (mode === 'break') activeTab.classList.add('break');
            if (mode === 'long-break') activeTab.classList.add('long-break');

            // Update body class
            document.body.className = mode;

            // Update timer
            switch(mode) {
                case 'work':
                    totalTime = settings.workDuration * 60;
                    sessionLabel.textContent = 'Focus Time';
                    progressCircle.style.stroke = 'var(--work-color)';
                    break;
                case 'break':
                    totalTime = settings.breakDuration * 60;
                    sessionLabel.textContent = 'Short Break';
                    progressCircle.style.stroke = 'var(--break-color)';
                    break;
                case 'long-break':
                    totalTime = settings.longBreakDuration * 60;
                    sessionLabel.textContent = 'Long Break';
                    progressCircle.style.stroke = 'var(--long-break-color)';
                    break;
            }

            timeRemaining = totalTime;
            isRunning = false;
            clearInterval(intervalId);
            startBtn.textContent = '▶️';
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            startBtn.textContent = '⏸️';
            
            intervalId = setInterval(() => {
                timeRemaining--;
                
                if (currentMode === 'work') {
                    totalFocusSeconds++;
                    updateStats();
                }
                
                updateDisplay();
                
                if (timeRemaining <= 0) {
                    timerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            startBtn.textContent = '▶️';
            clearInterval(intervalId);
        }

        function resetTimer() {
            pauseTimer();
            timeRemaining = totalTime;
            updateDisplay();
        }

        function skipTimer() {
            timerComplete();
        }

        function timerComplete() {
            pauseTimer();
            playSound();
            showNotification();

            if (currentMode === 'work') {
                pomodorosCompleted++;
                updateStats();
                
                // Determine next break type
                if (pomodorosCompleted % settings.longBreakInterval === 0) {
                    setMode('long-break');
                } else {
                    setMode('break');
                }
            } else {
                setMode('work');
            }

            if (settings.autoStart) {
                setTimeout(startTimer, 1000);
            }
        }

        function playSound() {
            if (!settings.soundEnabled) return;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function showNotification() {
            const messages = {
                'work': 'Break time! 🎉',
                'break': 'Back to work! 💪',
                'long-break': 'Back to work! 💪'
            };
            
            notification.textContent = messages[currentMode];
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);

            // Browser notification if permitted
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Pomodoro Timer', { body: messages[currentMode] });
            }
        }

        function toggleSettings() {
            document.getElementById('settings').classList.toggle('open');
        }

        function updateSettings() {
            settings.workDuration = parseInt(document.getElementById('work-duration').value) || 25;
            settings.breakDuration = parseInt(document.getElementById('break-duration').value) || 5;
            settings.longBreakDuration = parseInt(document.getElementById('long-break-duration').value) || 15;
            settings.longBreakInterval = parseInt(document.getElementById('long-break-interval').value) || 4;
            settings.autoStart = document.getElementById('auto-start').checked;
            settings.soundEnabled = document.getElementById('sound-enabled').checked;

            // Update current timer if not running
            if (!isRunning) {
                setMode(currentMode);
            }

            // Save to localStorage
            localStorage.setItem('pomodoroSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem('pomodoroSettings');
            if (saved) {
                settings = { ...settings, ...JSON.parse(saved) };
                document.getElementById('work-duration').value = settings.workDuration;
                document.getElementById('break-duration').value = settings.breakDuration;
                document.getElementById('long-break-duration').value = settings.longBreakDuration;
                document.getElementById('long-break-interval').value = settings.longBreakInterval;
                document.getElementById('auto-start').checked = settings.autoStart;
                document.getElementById('sound-enabled').checked = settings.soundEnabled;
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            }
            if (e.key === 'r' || e.key === 'R') {
                resetTimer();
            }
        });

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Initialize
        loadSettings();
        setMode('work');
    </script>
</body>
</html>
